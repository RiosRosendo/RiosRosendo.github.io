<!-- Diagnóstico: se oculta automáticamente si React monta correctamente -->
<div id="diag" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-family:monospace;font-size:13px;background:#0e121e;padding:20px 28px;border-radius:12px;border:1px solid rgba(255,255,255,0.15);z-index:99999;text-align:center;pointer-events:none;">
  Cargando...<br><small style="color:#6f9bff;">Si persiste: abre F12 → Console</small>
</div>
<script>
  (function() {
    var diag = document.getElementById('diag');
    var check = setInterval(function() {
      var root = document.getElementById('root');
      if (root && root.children.length > 0) {
        diag.style.display = 'none';
        clearInterval(check);
      }
    }, 500);
    // Mostrar error si no carga en 8s
    setTimeout(function() {
      clearInterval(check);
      var root = document.getElementById('root');
      if (!root || root.children.length === 0) {
        diag.innerHTML = '⚠ Error de JavaScript<br><small style="color:#f5a524;">Abre F12 → Console y comparte el error</small>';
        diag.style.pointerEvents = 'auto';
      }
    }, 8000);
  })();
</script>
</body>
